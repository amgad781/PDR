<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDR Lab: step counting</title>
<style>
  :root{--bg:#fff;--ink:#222;--line:#ccc;--accent:#1a7f4b;font-family:system-ui,sans-serif}
  @media(prefers-color-scheme:dark){:root{--bg:#1d1f21;--ink:#eee;--line:#444}}
  body{margin:0;padding:14px;background:var(--bg);color:var(--ink);max-width:560px;margin-inline:auto}
  button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible{outline:3px solid var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
  canvas{width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:8px 0}
  label{font-size:.85rem} input[type=number]{width:70px;padding:6px}
  #info{font-family:monospace;font-size:.85rem;direction:ltr;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<h2>PDR Lab: عدّاد الخطوات</h2>
<div class="row">
  <button class="p" id="perm">1) السماح بالحساسات</button>
  <button id="start">2) ابدأ</button>
  <button id="corner">علّم ركن</button>
  <button id="stop">إيقاف</button>
  <button id="csv">تنزيل CSV</button>
</div>
<div class="row">
  <label>Threshold <input id="th" type="number" step="0.1" value="1.0"></label>
  <label>Min interval (ms) <input id="mi" type="number" step="50" value="300"></label>
  <label>Step length (m) <input id="sl" type="number" step="0.05" value="0.7"></label>
</div>
<canvas id="sig" width="560" height="150"></canvas>
<canvas id="map" width="560" height="360"></canvas>
<div id="info">اضغط 1 ثم 2 وابدأ المشي.</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
// ---------- state ----------
let running=false, heading=0, hasHeading=false;
let grav=9.81, sm=0, p1=0, p2=0, lastStepT=-1e9;     // filter + peak detector memory
let pos={x:0,y:0}, path=[{x:0,y:0}], corners=[], steps=0;
const sig=[], stepMarks=[], log=[];                    // plot buffer, step indexes, CSV rows
let orient={alpha:null,beta:null,gamma:null};

// ---------- permissions + sensors ----------
$("perm").onclick=async()=>{
  try{
    for(const E of [DeviceMotionEvent,DeviceOrientationEvent])
      if(typeof E.requestPermission==="function" && await E.requestPermission()!=="granted") throw 0;
    window.addEventListener("devicemotion",onMotion);
    window.addEventListener("deviceorientationabsolute",onOrient);   // Android
    window.addEventListener("deviceorientation",onOrient);            // iOS / fallback
    $("info").textContent="الحساسات شغالة. اضغط ابدأ.";
  }catch(e){$("info").textContent="الإذن مرفوض أو الحساسات مش متاحة (لازم HTTPS).";}
};
function onOrient(e){
  orient={alpha:e.alpha,beta:e.beta,gamma:e.gamma};
  if(e.webkitCompassHeading!=null){heading=e.webkitCompassHeading;hasHeading=true}          // iOS: degrees from north
  else if(e.absolute&&e.alpha!=null){heading=(360-e.alpha)%360;hasHeading=true}            // Android absolute
}

// ---------- step detection (the core) ----------
function onMotion(e){
  if(!running) return;
  const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
  const t=performance.now();
  const mag=Math.hypot(a.x,a.y,a.z);          // 1) orientation-independent magnitude
  grav=grav*0.98+mag*0.02;                    // 2) slow average ~ gravity (high-pass: remove it)
  const v=mag-grav;
  sm=sm*0.7+v*0.3;                            // 3) low-pass smoothing
  const TH=+$("th").value, MI=+$("mi").value;
  // 4) peak: previous sample is higher than both neighbours and above the threshold
  let isStep=false;
  if(p1>p2 && p1>=sm && p1>TH && t-lastStepT>MI){
    isStep=true; lastStepT=t; steps++;
    const L=+$("sl").value, h=heading*Math.PI/180;
    pos={x:pos.x+L*Math.sin(h), y:pos.y-L*Math.cos(h)};       // 5) dead reckoning
    path.push({...pos}); stepMarks.push(sig.length-1);
  }
  p2=p1; p1=sm;
  sig.push(sm); if(sig.length>400){sig.shift();for(let i=0;i<stepMarks.length;i++)stepMarks[i]--;while(stepMarks[0]<0)stepMarks.shift()}
  log.push([t.toFixed(0),a.x,a.y,a.z,orient.alpha,orient.beta,orient.gamma,heading.toFixed(1),isStep?1:0]);
  draw();
}

// ---------- geometry ----------
const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a.x*b.y-b.x*a.y},0))/2;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ---------- drawing ----------
function draw(){
  const s=$("sig").getContext("2d"), W=560, H=150; s.clearRect(0,0,W,H);
  const col=getComputedStyle(document.body).color; s.strokeStyle=col; s.fillStyle=col;
  const y0=H/2, k=12; s.beginPath();
  sig.forEach((v,i)=>{const x=i*W/400,y=y0-v*k; i?s.lineTo(x,y):s.moveTo(x,y)}); s.stroke();
  s.strokeStyle="#c0392b"; s.beginPath(); const ty=y0-(+$("th").value)*k; s.moveTo(0,ty); s.lineTo(W,ty); s.stroke();
  s.fillStyle="#1a7f4b"; stepMarks.forEach(i=>{s.beginPath(); s.arc(i*W/400,y0-sig[i]*k,4,0,7); s.fill()});

  const m=$("map").getContext("2d"), MW=560, MH=360; m.clearRect(0,0,MW,MH);
  const pts=path.concat(corners); const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minx=Math.min(...xs,-1),maxx=Math.max(...xs,1),miny=Math.min(...ys,-1),maxy=Math.max(...ys,1);
  const sc=Math.min((MW-40)/(maxx-minx),(MH-40)/(maxy-miny)), X=p=>20+(p.x-minx)*sc, Y=p=>20+(p.y-miny)*sc;
  m.strokeStyle="#2980b9"; m.beginPath(); path.forEach((p,i)=>i?m.lineTo(X(p),Y(p)):m.moveTo(X(p),Y(p))); m.stroke();
  m.fillStyle="#c0392b"; corners.forEach(p=>{m.beginPath();m.arc(X(p),Y(p),5,0,7);m.fill()});
  if(corners.length>2){m.strokeStyle="#1a7f4b";m.beginPath();corners.forEach((p,i)=>i?m.lineTo(X(p),Y(p)):m.moveTo(X(p),Y(p)));m.closePath();m.stroke()}
  let txt=`steps: ${steps}  heading: ${heading.toFixed(0)}°${hasHeading?"":" (no compass yet)"}\nx=${pos.x.toFixed(2)} y=${pos.y.toFixed(2)} m`;
  if(corners.length>2){
    const per=corners.reduce((s,p,i)=>s+dist(p,corners[(i+1)%corners.length]),0);
    txt+=`\ncorners: ${corners.length}  area≈${area(corners).toFixed(2)} m²  perimeter≈${per.toFixed(2)} m`;
  }
  $("info").textContent=txt;
}

// ---------- buttons ----------
$("start").onclick=()=>{running=true;steps=0;pos={x:0,y:0};path=[{x:0,y:0}];corners=[];sig.length=0;stepMarks.length=0;log.length=0;lastStepT=-1e9;corners.push({x:0,y:0});draw()};
$("corner").onclick=()=>{corners.push({...pos});draw()};
$("stop").onclick=()=>{running=false;draw()};
$("csv").onclick=()=>{
  const rows=["t_ms,ax,ay,az,alpha,beta,gamma,heading,step",...log.map(r=>r.join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([rows],{type:"text/csv"})); a.download="pdr_log.csv"; a.click();
};
</script>
</body>
</html>
